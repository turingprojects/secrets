services:
  redis:
    image: redis:latest
    container_name: redis_yopass
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - /dockers/redis/data:/data
    networks:
      - yopass-network

  yopass:
    build:
      context: .
      dockerfile: Dockerfile
    image: turing/yopass
    container_name: yopass
    restart: always
    ports:
      - "1337:1337"
    environment:
      # Business license (unlocks branding); set it in .env, never in git
      - LICENSE_KEY=${LICENSE_KEY:?Set LICENSE_KEY in .env}
      # Turing Secrets branding
      - APP_NAME=Turing Secrets
      - LOGO_URL=/turing-logo.svg
      # Hide the features cards on the home page
      - DISABLE_FEATURES=true
      # Default secret lifetime: one week
      - DEFAULT_EXPIRY=1w
    depends_on:
      - redis
    command: ["--database", "redis", "--redis", "redis://redis:6379"]
    networks:
      - yopass-network

networks:
  yopass-network:
    driver: bridge
